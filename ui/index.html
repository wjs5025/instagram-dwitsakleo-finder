<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>뒷삭러 찾기 for Instagram</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>뒷삭러 찾기 <span class="sub">for Instagram</span></h1>

    <section id="panel" class="panel">
      <p id="statusText" class="status"></p>
      <button id="startBtn" type="button">시작하기</button>
    </section>

    <section id="resultSection" hidden>
      <p id="meta" class="meta"></p>
      <input id="search" type="search" placeholder="사용자명 검색..." autocomplete="off">
      <table>
        <thead>
          <tr><th>사용자명</th><th>이름</th><th></th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </section>

    <p class="footer"><button id="logoutBtn" type="button" class="link-btn">다른 계정으로 로그인 (로그아웃)</button></p>
  </main>
  <script src="/app.js"></script>
</body>
</html>
